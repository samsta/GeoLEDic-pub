<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
polygon {
  stroke: black;
}
html, body {
  height: 100%;
  margin: 0;
  overflow-x: hidden;
}
#container {
  display: flex;
  height: 100vh;
  align-items: flex-start;
  position: relative;
}
#sidebar {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  min-width: 150px;
}
div#element_info {
  width: 100%;
}
div#stats {
  width: 100%;
}

/* In portrait the SVG fills the full width, so overlay the sidebar at the bottom */
@media (orientation: portrait) {
  #sidebar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: auto;
    max-height: 40vh;
    background: rgba(255,255,255,0.9);
  }
}


div#element_info > table {
  display: flex;
  background-color: lightgray;
  flex-direction: column;
  align-self: stretch;
}
table {
  margin-bottom: 3px;
  width: 100%;
  box-sizing: border-box;
}

div#strut_list {
  margin: 20px;
}

table#strut_table {
  margin: 10px;
  border-collapse: collapse;
  width:auto;
  border: 1px solid black;

  th {
    border: 1px solid black;
    padding: 4px;
    background-color: lightgray;
  }
  th.sortable {
    cursor: pointer;
    user-select: none;
  }
  th.sortable:hover {
    background-color: #b0b0b0;
  }
  th.sortable[data-sort-dir="asc"]::after { content: " ▲"; }
  th.sortable[data-sort-dir="desc"]::after { content: " ▼"; }
  tr {
    border-bottom: 1px solid black;
  }
  td {
    border: 1px solid black;
    padding: 4px;
  }
}

.hub {
  stroke: black;
  stroke-width: 4px;
}
.powered-hub {
  fill: firebrick;
} 
.unpowered-hub {
  fill: gray;
}
.signal-wire {
  stroke: green;
  stroke-width: 2px;
  fill: none;
}
.power-wire {
  stroke: firebrick;
  stroke-width: 2px;
  fill: none;
}
.led-strip {
  stroke: orange;
  stroke-width: 3px;
  stroke-dasharray: 3, 1;
}
.fat {
  stroke-width: 8px;
}
.strip-start {
  fill: green;
  stroke: black;
  stroke-width: 1px;
}
#strut_svg {
  margin-top:10px;
}
#legend {
  position: absolute;
  left: 20px;
  top: 20px;
  transform-origin: top left;
}
#svg {
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
}
</style>
</head>
<body>
<div id="container">
  <svg id="svg" width="1300" height="1300" viewBox="0 0 1300 1300">
  </svg>
  <div id="legend">
    <table>
      <tr><td><svg width="30" height="25"><circle cx="15" cy="12.5" r="10" class="hub powered-hub"/></svg></td><td>Powered Hub</td></tr>
      <tr><td><svg width="30" height="25"><circle cx="15" cy="12.5" r="10" class="hub unpowered-hub"/></svg></td><td>Unpowered Hub</td></tr>
      <tr><td><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" class="signal-wire"/></svg></td><td>Signal Wire</td></tr>
      <tr><td><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" class="power-wire"/></svg></td><td>Power Wire</td></tr>
      <tr><td><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" class="led-strip"/></svg></td><td>LED Strip</td></tr>
      <tr><td><svg width="30" height="10"><circle cx="15" cy="5" r="4" class="strip-start"/></svg></td><td>Strip Start</td></tr>
      <tr><td><input type="checkbox" id="toggle-triangle-opacity"></td><td>Triangle Background</td></tr>
      <tr><td><input type="checkbox" id="toggle-debug-info"></td><td>Debug Info</td></tr>
    </table>
  </div>
  <div id="sidebar">
    <div id="stats"></div>
    <div id="element_info"></div>
  </div>
</div>

  return "rgb(" + 255*Math.sqrt(0.5 + (index & 0x1)/2) + ", "
    + 255*Math.sqrt(((index >> 1) & 0x3)/3) + ", "
    + 255*Math.sqrt(((index >> 3) & 0x3)/3) + ")";
}

function tierColor(tier) {
  var c = tier*3 + (tier&1)*50;
  return "rgb(" + c + ", " + c + ", " + c + ")";
}

function strutTypeColor(type) {
  switch (type) {
    case "A":
      return "#e0a000";
    case "B":
      return "#0000ff";
    case "C":
      return "#ff4040";
    case "D":
      return "#000000";
    case "E":
      return "#808080";
    case "F":
      return "#80101a";
    default:
      return "#800080";
  }
}

function distance(a, b) {
  if (a.length == 3) {
    return Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2);
  } else if (a.length == 2) {
    return Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2);
  } else {
    throw "Invalid length for distance function";
  }
}

function arrowhead(x, y, angle_deg, color) {
  const angle = angle_deg * Math.PI / 180;
  const size = 10;
  var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  var angle1 = angle + Math.PI/6;
  var angle2 = angle - Math.PI/6;
  var x1 = x - size * Math.cos(angle1);
  var y1 = y - size * Math.sin(angle1);
  var x2 = x - size * Math.cos(angle2);
  var y2 = y - size * Math.sin(angle2);
  path.setAttribute("d", `M ${x} ${y} L ${x1} ${y1} L ${x2} ${y2} Z`);
  path.setAttribute("fill", color);
  return path;
}

function drawStrutSvg(svg, index) {
  var strut = struts[index];
  // add rectangle representing strut
  var rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  rect.setAttribute("x", 100);
  rect.setAttribute("y", 30);
  rect.setAttribute("width", 200);
  rect.setAttribute("height", 40);
  svg.appendChild(rect);

  // label it with index in center
  var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
  text.setAttribute("x", 200);
  text.setAttribute("y", 55);
  text.setAttribute("text-anchor", "middle");
  text.setAttribute("font-size", "20");
  text.setAttribute("font-weight", "bold");
  text.setAttribute("fill", "white");
  text.textContent = index;
  svg.appendChild(text);  

  // orient strut so that the hub on the left as seen from the center
  //  is drawn on the left
  var flip = false;
  var hub1 = hubs[strut.hub_keys[0]];
  var hub2 = hubs[strut.hub_keys[1]];
  var hub1_proj = flatten3dCoordinates(hub1.center);
  var hub2_proj = flatten3dCoordinates(hub2.center);
  var angle_start = Math.atan2(hub1_proj[1] - CENTER[1], hub1_proj[0] - CENTER[0]);
  var angle_end = Math.atan2(hub2_proj[1] - CENTER[1], hub2_proj[0]- CENTER[0]);
  var angle_diff = angle_end - angle_start;
  if (angle_diff > Math.PI) {
    angle_diff -= TWO_PI;
  } else if (angle_diff < -Math.PI) {
    angle_diff += TWO_PI;
  }
  if (angle_diff < 0) {
    flip = !flip;
  }

  var left = flip;
  strut["powered"] = [false, false];
  for (hub_key of strut.hub_keys) {
    var hub = hubs[hub_key];
    var hub_index = hub.ix;
    strut.powered[left ? 0 : 1] = powered_hubs.includes(hub_index);
    var circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", left ? 30 : 370);
    circle.setAttribute("cy", 50);
    circle.setAttribute("r", 25);
    circle.setAttribute("class", powered_hubs.includes(hub_index) ? "hub powered-hub" : "hub unpowered-hub");
    svg.appendChild(circle);
    // label it with hub index in center, hub name at the bottom
    var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", left ? 30 : 370);
    text.setAttribute("y", 55);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("font-size", "14");
    text.setAttribute("font-weight", "bold");
    text.setAttribute("fill", "white");
    text.textContent = hub_index;
    svg.appendChild(text);
    var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", left ? 1 : 399);
    text.setAttribute("y", 90);
    text.setAttribute("text-anchor", left ? "start" : "end");
    text.setAttribute("font-size", "12");
    text.textContent = hub.name;
    svg.appendChild(text);
    left = !left;
  }

  var top = !flip;
  for (edge of strut.edges)
  {
    // draw orange line for strips
    var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    var len = 200;
    var startx = 100;
    var endx = 300;
    edge["top"] = top;
    var offset = len * ((strut.length - triangles[edge.triangle].edges[edge.edge].length)/ strut.length);
    if (edge.alt_start) {
      if (top) {
        endx -= offset;
      } else {
        startx += offset;
      }
    } else if (edge.alt_end) {
      if (top) {  
        startx += offset;
      } else {
        endx -= offset;
      }
    }

    line.setAttribute("x1", startx);
    line.setAttribute("y1", top ? 30 : 70);
    line.setAttribute("x2", endx);
    line.setAttribute("y2", top ? 30 : 70);
    line.setAttribute("class", "led-strip fat");
    svg.appendChild(line);

    // label it with edge length in center
    var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", (startx + endx)/2);
    text.setAttribute("y", top ? 25 : 75);
    text.setAttribute("dominant-baseline", top ? "text-after-edge" : "text-before-edge");
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("font-size", "12");
    text.textContent = Number(triangles[edge.triangle].edges[edge.edge].length.toFixed(3)) + 'm';
    svg.appendChild(text);

    edge["startx"] = startx;
    edge["endx"] = endx;
    top = !top;
  }

  top = !flip;
  var both_powered = strut.powered[0] && strut.powered[1];
  for (i in [0, 1]) {
    var edge = strut.edges[i];
    var other_edge = strut.edges[(i+1)%2];
    if (edge == undefined) {
      continue;
    }

    if (edge.peers.end && edge.peers.end.strut == strut.ix) {
      // connects to other strip on same strut
      // green cubic bezier to self
      var line = document.createElementNS("http://www.w3.org/2000/svg", "path");
      line.setAttribute("d", `M ${top ? edge.startx : other_edge.endx} 30 C ${top ? 75 : 325} 30 ${top ? 75 : 325} 70 ${top ? other_edge.startx : edge.endx} 70`);
      line.setAttribute("class", "signal-wire");
      svg.appendChild(line);
      svg.appendChild(arrowhead(top ? edge.startx : edge.endx, top ? 70 : 30, top ? 15 : 195, "green"));
      // always have a power wire on the loops
      var line = document.createElementNS("http://www.w3.org/2000/svg", "path");
      line.setAttribute("d", `M ${top ? edge.startx : edge.endx} ${top ? 28 : 72} C ${top ? edge.startx-30 : edge.endx+30} ${top ? 28 : 72} ${top ? edge.startx-10 : edge.endx+10} 50 ${top ? edge.startx-40 : edge.endx+40} 50`);
      line.setAttribute("class", "power-wire");
      svg.appendChild(line);
    } else if (edge.peers.end) {
      // connects to strip on other strut
      // green quadratic bezier to other strut
      var line = document.createElementNS("http://www.w3.org/2000/svg", "path");
      var y = top ? 30 : 70;
      var y2 = top ? 0 : 100;
      line.setAttribute("d", `M ${top ? edge.startx : edge.endx} ${y} Q ${top ? edge.startx-20 : edge.endx+20} ${y} ${top ? edge.startx-20 : edge.endx+20} ${y2}`);
      line.setAttribute("class", "signal-wire");
      svg.appendChild(line);
      svg.appendChild(arrowhead(top ? edge.startx-20 : edge.endx+20, y2, top ? -90 : 90, "green"));
      // add label with peer strut index
      y = top ? 20 : 90;
      var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", top ? edge.startx - 10 : edge.endx + 10);
      text.setAttribute("y", y);
      text.setAttribute("text-anchor", top ? "start" : "end");
      text.setAttribute("font-size", "14");
      text.setAttribute("fill", "green");
      text.textContent = edge.peers.end.strut;
      svg.appendChild(text);
      // have a power wire if adjacent hub is powered
      if (strut.powered[top ? 0 : 1]) {
        var line = document.createElementNS("http://www.w3.org/2000/svg", "path");
        line.setAttribute("d", `M ${top ? edge.startx : edge.endx} ${top ? 28 : 72} C ${top ? edge.startx-30 : edge.endx+30} ${top ? 28 : 72} ${top ? edge.startx-10 : edge.endx+10} 50 ${top ? edge.startx-40 : edge.endx+40} 50`);
        line.setAttribute("class", "power-wire");
        svg.appendChild(line);
      }
    }
    if (edge.peers.start && edge.peers.start.strut != strut.ix) {
      // connects to strip on other strut
      // green quadratic bezier to other strut
      var line = document.createElementNS("http://www.w3.org/2000/svg", "path");
      var y = top ? 30 : 70;
      var y2 = top ? 0 : 100;
      line.setAttribute("d", `M ${top ? edge.endx : edge.startx} ${y} Q ${top ? edge.endx+20 : edge.startx-20} ${y} ${top ? edge.endx+20 : edge.startx-20} ${y2}`);
      line.setAttribute("class", "signal-wire");
      svg.appendChild(line);
      svg.appendChild(arrowhead(top ? edge.endx : edge.startx, y, top ? 165 : -15, "green"));
      // add label with peer strut index
      y = top ? 20 : 90;
      var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", top ? edge.endx + 10 : edge.startx - 10);
      text.setAttribute("y", y);
      text.setAttribute("text-anchor", top ? "end" : "start");
      text.setAttribute("font-size", "14");
      text.setAttribute("fill", "green");
      text.textContent = edge.peers.start.strut;
      svg.appendChild(text);
    } 

    if (!edge.peers.start) {
      // beginning of strip, always powered
      var line = document.createElementNS("http://www.w3.org/2000/svg", "path");
      line.setAttribute("d", `M ${top ? edge.endx : edge.startx} ${top ? 28 : 72} C ${top ? edge.endx+30 : edge.startx-30} ${top ? 28 : 72} ${top ? edge.endx+10 : edge.startx-10} 50 ${top ? edge.endx+40 : edge.startx-40} 50`);
      line.setAttribute("class", "power-wire");
      svg.appendChild(line);
      // beginning of strip, draw green circle
      var circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", top ? edge.endx : edge.startx);
      circle.setAttribute("cy", top ? 30 : 70);
      circle.setAttribute("r", 8);
      circle.setAttribute("class", "strip-start");
      svg.appendChild(circle);
    }

    if (!edge.peers.end && strut.tier > 0) {
      // end of strip, always powered, except for tier 0
      var line = document.createElementNS("http://www.w3.org/2000/svg", "path");
      line.setAttribute("d", `M ${top ? edge.startx : edge.endx} ${top ? 28 : 72} C ${top ? edge.startx-30 : edge.endx+30} ${top ? 28 : 72} ${top ? edge.startx-10 : edge.endx+10} 50 ${top ? edge.startx-40 : edge.endx+40} 50`);
      line.setAttribute("class", "power-wire");
      svg.appendChild(line);
    }
    top = !top;
  }
}

function normalize(v) {
    const len = Math.hypot(v[0], v[1], v[2]);
    if (len === 0) return [0, 0, 0];
    return [v[0] / len, v[1] / len, v[2] / len];
}

function dot(a, b) {
    return a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
}

function cross(a, b) {
    return [
        a[1]*b[2] - a[2]*b[1],
        a[2]*b[0] - a[0]*b[2],
        a[0]*b[1] - a[1]*b[0]
    ];
}

function subtract(a, b) {
    return [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
}

function scale(v, s) {
    return [v[0]*s, v[1]*s, v[2]*s];
}

function projectOntoPlane(v, normal) {
    const d = dot(v, normal);
    return subtract(v, scale(normal, d));
}

function computeProjectedAngles(P, points) {
    const origin = [0, 0, 0];

    // Plane normal
    const n = normalize(subtract(P, origin));

    // Z-up
    const up = [0, 0, 1];

    // Define north
    let north = projectOntoPlane(up, n);
    let northLen = Math.hypot(...north);

    if (northLen === 0) {
        north = projectOntoPlane([1, 0, 0], n);
        northLen = Math.hypot(...north);
    }

    north = [north[0]/northLen, north[1]/northLen, north[2]/northLen];

    // IMPORTANT: flipped cross product because X is reversed
    const east = normalize(cross(north, n));

    const angles = [];

    for (const Q of points) {
        const d = subtract(Q, P);
        let dProj = projectOntoPlane(d, n);
        dProj = normalize(dProj);

        const x = dot(dProj, east);
        const y = dot(dProj, north);

        // 0° = north, positive clockwise
        const angleRad = Math.atan2(x, y);
        const angleDeg = angleRad * 180 / Math.PI;

        angles.push(normalizeDeg(angleDeg));
    }

    return angles;
}


const FULL = 360;

function normalizeDeg(angle) {
  return ((angle % FULL) + FULL) % FULL;
}

function circularDistanceDeg(a, b) {
  const diff = Math.abs(a - b);
  return Math.min(diff, FULL - diff);
}

function minDistanceDeg(A, B, theta = 0) {
  let minDist = Infinity;

  for (const b of B) {
    const rotated = normalizeDeg(b + theta);

    for (const a of A) {
      const d = circularDistanceDeg(rotated, a);
      if (d < minDist) {
        minDist = d;
      }
    }
  }

  return minDist;
}

function bestRotationIfAboveThresholdDeg(A, B, thresholdDeg) {
  // Early check at 0°
  const baseMin = minDistanceDeg(A, B, 0);

  if (baseMin >= thresholdDeg) {
    return {rotationDeg: 0, minDistanceDeg: baseMin};
  }

  // Sort A
  A = [...A].map(normalizeDeg).sort((x, y) => x - y);
  B = B.map(normalizeDeg);

  // Midpoints of gaps in A
  const midpoints = [];
  for (let i = 0; i < A.length; i++) {
    const a1 = A[i];
    const a2 = A[(i + 1) % A.length];
    const gap = normalizeDeg(a2 - a1);
    midpoints.push(normalizeDeg(a1 + gap / 2));
  }

  let bestTheta = 0;
  let bestScore = baseMin;

  for (const m of midpoints) {
    for (const b of B) {
      const theta = normalizeDeg(m - b);
      const score = minDistanceDeg(A, B, theta);

      if (score > bestScore) {
        bestScore = score;
        bestTheta = theta;
      }
    }
  }

  return {
    rotationDeg: bestTheta,
    minDistanceDeg: bestScore
  };
}

function showHubInfo(key) {
  var hub = hubs[key];
  var info = ` <h2>${hub.name}</h2>
               <table><tr><th>Index</th><td>${hub.ix}</td></tr>
                      <tr><th>Powered</th><td>${powered_hubs.includes(hub.ix) ? "Yes" : "No"}</td></tr>
                      <tr><th>Position</th><td>${hub.center}</td></tr>
                      <tr><th>Tier</th><td>${hub.tier}</td></tr>
               </table>
               <table>
               <tr><th>Strut</th><th>Type</th><th>Tier</th><th>To</th></tr>`;
  for (strut_info of hub.struts) {
    var strut = strut_info.strut;
    info += `<tr><td>${strut.ix}</td>
                 <td>${strut.type}</td>
                 <td>${strut.tier}</td>
                 <td>${strut_info.other_endpoint}</td></tr>`;
  }
  info += "</table><svg id='hub_svg' width='400' height='400'></svg>";
  document.getElementById("element_info").innerHTML = info;
  // add an svg circle
  const center = {x: 200, y: 200};
  const radius = 180;
  var spoke_angles = [0, 130, 230];
  var rotate = 0;

  var endpoints = [];
  for (strut_info of hub.struts) {
    endpoints.push(strut_info.other_endpoint);
  }
  var strut_angles = computeProjectedAngles(hub.center, endpoints);

  var min_tier = 999;
  for (strut_info of hub.struts) {
    if (strut_info.strut.tier < min_tier) {
      min_tier = strut_info.strut.tier;
    }
  }
  if (hub.struts.length == 5 && min_tier > 2 && min_tier < 6) {
    // it's one of the lower pentagons
    rotate = 180;
  } else {
    var bestRotation = bestRotationIfAboveThresholdDeg(strut_angles, spoke_angles, 10);
    if (bestRotation) {
      rotate = bestRotation.rotationDeg;
    } else {
      console.log("No significant rotation found for hub " + key);
    }
  }
  
  var svg = document.getElementById("hub_svg");
  var circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  circle.setAttribute("cx", center.x);
  circle.setAttribute("cy", center.y);
  circle.setAttribute("r", radius);
  circle.setAttribute("fill", "none");
  circle.setAttribute("stroke", "firebrick");
  circle.setAttribute("stroke-width", "30");
  svg.appendChild(circle);

  var line1 = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line1.setAttribute("x1", center.x);
  line1.setAttribute("y1", center.y);
  line1.setAttribute("x2", center.x + radius * Math.sin((spoke_angles[0]) * Math.PI / 180));
  line1.setAttribute("y2", center.y - radius * Math.cos((spoke_angles[0]) * Math.PI / 180));
  line1.setAttribute("stroke", "firebrick");
  line1.setAttribute("stroke-width", "30");
  svg.appendChild(line1);

  var line2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line2.setAttribute("x1", center.x);
  line2.setAttribute("y1", center.y);
  line2.setAttribute("x2", center.x + radius * Math.sin((spoke_angles[1]) * Math.PI / 180));
  line2.setAttribute("y2", center.y - radius * Math.cos((spoke_angles[1]) * Math.PI / 180));
  line2.setAttribute("stroke", "firebrick");
  line2.setAttribute("stroke-width", "30");
  svg.appendChild(line2);

  var line3 = document.createElementNS("http://www.w3.org/2000/svg", "line");
  line3.setAttribute("x1", center.x);
  line3.setAttribute("y1", center.y);
  line3.setAttribute("x2", center.x + radius * Math.sin((spoke_angles[2]) * Math.PI / 180));
  line3.setAttribute("y2", center.y - radius * Math.cos((spoke_angles[2]) * Math.PI / 180));
  line3.setAttribute("stroke", "firebrick");
  line3.setAttribute("stroke-width", "30");
  svg.appendChild(line3);

  var namelabel = document.createElementNS("http://www.w3.org/2000/svg","text");
  namelabel.setAttribute("x", center.x);
  namelabel.setAttribute("y", center.y);
  namelabel.setAttribute("font-size", 18);
  namelabel.setAttribute("fill", "white");
  namelabel.setAttribute("font-weight", "bold");
  namelabel.setAttribute("dominant-baseline", "middle");
  namelabel.setAttribute(
      "transform",
      `rotate(${spoke_angles[0]-90}, ${center.x}, ${center.y})`
  );
  namelabel.textContent = hub.name;
  svg.appendChild(namelabel);


  for (let i = 0; i < strut_angles.length; i++) {
    const angle = strut_angles[i] - rotate;
    const r = 180;
    const cx = 200;
    const cy = 200;
    
    const rad = angle * Math.PI / 180;

    const x = cx + r * Math.sin(rad);
    const y = cy - r * Math.cos(rad);

    const label = document.createElementNS(
      "http://www.w3.org/2000/svg",
      "text"
    );

    label.setAttribute("x", x);
    label.setAttribute("y", y);
    label.setAttribute("font-size", "20");
    label.setAttribute("fill", "white");
    label.setAttribute("font-weight", "bold");
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("dominant-baseline", "middle");

    label.setAttribute(
      "transform",
      `rotate(${angle}, ${x}, ${y})`
    );

    label.textContent = `${hub.struts[i].strut.ix}`;
    svg.appendChild(label);
  }
}

function flatten3dCoordinates(obj_or_arr)
{
  if (Array.isArray(obj_or_arr)) {
    return flatten3dCoordinatesRaw(obj_or_arr[0], obj_or_arr[1], obj_or_arr[2]);
  }
  else {
    return flatten3dCoordinatesRaw(obj_or_arr.x, obj_or_arr.y, obj_or_arr.z);
  }
}

function flatten3dCoordinatesRaw(x, y, z) {
  var scale = 100;
  var zskew = 5;
  x = CENTER[0] + x * (scale - z * zskew);
  y = CENTER[1] - y * (scale - z * zskew);
  return [x, y];
}

function centroid(vertices_arr) {
  var centroid = {x: 0, y: 0, z: 0};
  for (value of vertices_arr) {
    centroid.x += value[0];
    centroid.y += value[1];
    centroid.z += value[2];
  }
  centroid.x /= vertices_arr.length;
  centroid.y /= vertices_arr.length;
  centroid.z /= vertices_arr.length;
  return centroid;
}

function hubKey(endpoint) {
  return Math.round(endpoint[0] * 10) + "," + Math.round(endpoint[1] * 10) + "," + Math.round(endpoint[2] * 10);
}

var hubs = {};
function addToHub(strut) {
  var endpoints = [strut.start, strut.end];
  strut["hub_keys"] = [];
  for (endpoint of endpoints) {
    var key = hubKey(endpoint);
    strut.hub_keys.push(key);
    var other_endpoint = (endpoint === strut.start) ? strut.end : strut.start;
    if (!(key in hubs)) {
      hubs[key] = { center: endpoint, struts: [], tier: 12};
    }
    if (strut.tier % 2 == 0) { // even tier must be horizontal, so we use the tier for the hub
      hubs[key].tier = strut.tier;
    }
    hubs[key].struts.push({
      other_endpoint: other_endpoint,
      strut: strut
    });
  }
}

function findHub(endpoint) {
  var key = hubKey(endpoint);
  return hubs[key];
}

function orderAndNameHubs() {
  var hub_keys = Object.keys(hubs);
  hub_keys.sort((a, b) => {
    var ha = hubs[a];
    var hb = hubs[b];
    if (ha.tier != hb.tier) {
      return ha.tier - hb.tier;
    }
    // if equal, order by angle
    return Math.atan2(ha.center[0], -ha.center[1]) - Math.atan2(hb.center[0], -hb.center[1]);
  });
  for (let i = 0; i < hub_keys.length; i++) {
    const key = hub_keys[i];
    hubs[key].ix = i;
    hubs[key].name = hub_names[i] || `Hub ${i}`;
    hubs[key].powered = powered_hubs.includes(i);
  }
}

var svg = document.getElementById("svg");

for (triangle of triangles) {
  if (triangle.no_leds) {
    continue;
  }
  // reorder vertex coordinates from xyz to xzy,
  //  essentially OpenGL style to SVG style, so that the y coordinate is vertical in the SVG
  for (let i = 0; i < triangle.vertices.length; i++) {
    const v = triangle.vertices[i];
    triangle.vertices[i] = [v[0], v[2], v[1]];
  }

  var polygon = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  svg.appendChild(polygon);

  for (value of triangle.vertices) {
    var point = svg.createSVGPoint();
    [point.x, point.y] = flatten3dCoordinates(value);
    polygon.points.appendItem(point);
  }

  var centr = centroid(triangle.vertices);
  polygon.setAttribute("fill", colorFromIndex(triangle.strip));
  polygon.setAttribute("data-triangle-ix", triangle.id);
  polygon.addEventListener("mouseover", function() {
    var index = this.getAttribute("data-triangle-ix");
    showTriangleInfo(index);
  });

  // label the triangle with triangle_ix
  var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
  [x, y] = flatten3dCoordinates(centr);
  text.setAttribute("x", x);
  text.setAttribute("y", y);
  text.setAttribute("font-size", "14");
  text.setAttribute("text-anchor", "middle");
  text.setAttribute("alignment-baseline", "middle");
  text.textContent = triangle.id;
  svg.appendChild(text);

  // label triangle corners at the midpoint between corner and centroid
  /*
  corner_ix = 0;
  for (value of triangle.vertices) {
    var point = svg.createSVGPoint();
    [point.x, point.y] = flatten3dCoordinates([
      (value[0] + centr.x) / 2,
      (value[1] + centr.y) / 2,
      (value[2] + centr.z) / 2
    ]);
    var corner_label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    corner_label.setAttribute("x", point.x);
    corner_label.setAttribute("y", point.y);
    corner_label.setAttribute("font-size", "10");
    corner_label.setAttribute("text-anchor", "middle");
    corner_label.setAttribute("fill", "black");
    corner_label.textContent = `${corner_ix}`;
    svg.appendChild(corner_label);
    corner_ix++;
  } */

}

var i = 0;
for (strut of struts) {
  addToHub(strut);

  [start, end] = [flatten3dCoordinates(strut.start), flatten3dCoordinates(strut.end)];

  // if extends beyond triangle, draw a thin line to the extended point
  if (strut.extends_beyond_corner) {
    var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", start[0]);
    line.setAttribute("y1", start[1]);
    line.setAttribute("x2", end[0]);
    line.setAttribute("y2", end[1]);
    line.setAttribute("stroke", "black");
    line.setAttribute("stroke-width", "1");
    svg.appendChild(line);
  }

  var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
  // shorten the lines
  var dirvec = [end[0] - start[0], end[1] - start[1]];
  var length = Math.sqrt(dirvec[0]*dirvec[0] + dirvec[1]*dirvec[1]);
  dirvec[0] /= length;
  dirvec[1] /= length;
   // we need a bit more space along the bottom tiers to fit the led strips
  var offset = Math.min(strut.tier < 2 ? 35 : 30, length / 2 - 10);
  start[0] += dirvec[0] * offset;
  start[1] += dirvec[1] * offset;
  end[0] -= dirvec[0] * offset;
  end[1] -= dirvec[1] * offset;
  strut["shortened_start"] = start;
  strut["shortened_end"] = end;
  strut["projected_start"] = flatten3dCoordinates(strut.start);
  strut["projected_end"] = flatten3dCoordinates(strut.end);
  line.setAttribute("x1", start[0]);
  line.setAttribute("y1", start[1]);
  line.setAttribute("x2", end[0]);
  line.setAttribute("y2", end[1]);
  line.setAttribute("stroke", strutTypeColor(strut.type));
  var width = 14;
  line.setAttribute("stroke-width", width);
  line.setAttribute("data-strut-index", i);
  line.addEventListener("mouseover", function() {
    var index = this.getAttribute("data-strut-index");
    showStrutInfo(index);
  });
  svg.appendChild(line);

  // calculate normal to line from start to end
  var dx = end[0] - start[0];
  var dy = end[1] - start[1];
  var length = Math.sqrt(dx*dx + dy*dy);
  var nx = -dy / length;
  var ny = dx / length;
  strut["led_strips"] = [
    {"start": [start[0] + nx * width/2, start[1] + ny * width/2], "end":   [end[0] + nx * width/2, end[1] + ny * width/2]},
    {"end":   [start[0] - nx * width/2, start[1] - ny * width/2], "start": [end[0] - nx * width/2, end[1] - ny * width/2]}
  ]
  
  var j = 0;
  for (edge of strut.edges) {
    edge["peers"] = {} // we'll fill this later when we place the wires
    var sign = (j == 0) ? 1 : -1;
    if (edge.alt_start) {
      strut.led_strips[j].start = flatten3dCoordinates(edge.alt_start);
      strut.led_strips[j].start[0] += sign * (nx * width/2 + ny * width*0.7);
      strut.led_strips[j].start[1] += sign * (ny * width/2 - nx * width*0.7);
    }
    if (edge.alt_end) {
      strut.led_strips[j].end = flatten3dCoordinates(edge.alt_end);
      strut.led_strips[j].end[0] += sign * (nx * width/2 - ny * width*0.7);
      strut.led_strips[j].end[1] += sign * (ny * width/2 + nx * width*0.7);
    }
    j++;
  }

  j = 0;
  for (led_strip of strut.led_strips) {
    var led_line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    led_line.setAttribute("x1", led_strip.start[0]);
    led_line.setAttribute("y1", led_strip.start[1]);
    led_line.setAttribute("x2", led_strip.end[0]);
    led_line.setAttribute("y2", led_strip.end[1]);
    led_line.setAttribute("class", "led-strip");
    svg.appendChild(led_line);

    // draw a small circle at the beginning of the strip
    if (triangles[strut.edges[j].triangle].edges[strut.edges[j].edge].first_led == 0) {
      var start_circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      start_circle.setAttribute("cx", led_strip.start[0]);
      start_circle.setAttribute("cy", led_strip.start[1]);
      start_circle.setAttribute("r", "4");
      start_circle.setAttribute("class", "strip-start");
      svg.appendChild(start_circle);
      wiring_stats.strip_starts++;
    }

    // add a label for the led ix at each end
    /*
    var led_label_start = document.createElementNS("http://www.w3.org/2000/svg", "text");
    led_label_start.setAttribute("x", led_strip.start[0]);
    led_label_start.setAttribute("y", led_strip.start[1]);
    led_label_start.setAttribute("font-size", "6");
    led_label_start.setAttribute("text-anchor", "middle");
    led_label_start.setAttribute("fill", "white");
    led_label_start.textContent = triangles[strut.edges[j].triangle].edges[strut.edges[j].edge].first_led;
    svg.appendChild(led_label_start);

    var led_label_end = document.createElementNS("http://www.w3.org/2000/svg", "text");
    led_label_end.setAttribute("x", led_strip.end[0]);
    led_label_end.setAttribute("y", led_strip.end[1]);
    led_label_end.setAttribute("font-size", "6");
    led_label_end.setAttribute("text-anchor", "middle");
    led_label_end.setAttribute("fill", "white");
    led_label_end.textContent = triangles[strut.edges[j].triangle].edges[strut.edges[j].edge].last_led;
    svg.appendChild(led_label_end);*/

    // if we don't have a second edge, skip
    if (strut.edges.length < 2) {
      break;
    }
    j++;
  }

  // label the strut with the index in sorted order. The label is rotated to be parallel to the strut, but never upside down (i.e. the text is always right side up).
  var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
  [x, y] = flatten3dCoordinates(strut.center);
  text.setAttribute("x", x);
  text.setAttribute("y", y+1);
  text.setAttribute("font-size", "12");
  text.setAttribute("text-anchor", "middle");
  text.setAttribute("font-weight", "bold");
  text.setAttribute("fill", "white");
  text.setAttribute("alignment-baseline", "middle");
  var angle = Math.atan2(end[1] - start[1], end[0] - start[0]) * 180 / Math.PI;
  if (angle > 90 || angle < -90) {
    angle += 180;
  }
  text.setAttribute("transform", "rotate(" + angle + " " + x + " " + y + ")");
  text.setAttribute("data-strut-index", i);
  text.addEventListener("mouseover", function() {
    var index = this.getAttribute("data-strut-index");
    showStrutInfo(index);
  });
  text.textContent = strut.ix;
  svg.appendChild(text);
  i++;
}

// now draw the connections between the strips on the struts as a cubic bezier curve
for (strut of struts) {
  var i = 0;
  for (edge of strut.edges) {
    var wire_start = strut.led_strips[i].end;
    var dirvec = [wire_start[0] - strut.led_strips[i].start[0], wire_start[1] - strut.led_strips[i].start[1]];
    var length = Math.sqrt(dirvec[0]*dirvec[0] + dirvec[1]*dirvec[1]);
    dirvec[0] /= length;
    dirvec[1] /= length;
    var control_strength = 10;
    var control_point1 = [wire_start[0] + dirvec[0] * control_strength, wire_start[1] + dirvec[1] * control_strength];
    var strip_ix = edge.strip;
    var led_ix = triangles[edge.triangle].edges[edge.edge].last_led + 1;
    // find the other edge
    for (connecting_strut of struts) {
      var j = 0;
      for (connecting_edge of connecting_strut.edges) {
        if (connecting_edge.strip == strip_ix && triangles[connecting_edge.triangle].edges[connecting_edge.edge].first_led == led_ix) {

          if (connecting_strut.ix == strut.ix) {
            wiring_stats.signal_loops++;
          } else {
            wiring_stats.jst_links++;
          }

          var wire_end = connecting_strut.led_strips[j].start;
          var dirvec_end = [wire_end[0] - connecting_strut.led_strips[j].end[0], wire_end[1] - connecting_strut.led_strips[j].end[1]];
          var length_end = Math.sqrt(dirvec_end[0]*dirvec_end[0] + dirvec_end[1]*dirvec_end[1]);
          dirvec_end[0] /= length_end;
          dirvec_end[1] /= length_end;
          var control_point2 = [wire_end[0] + dirvec_end[0] * control_strength, wire_end[1] + dirvec_end[1] * control_strength];
          var wire = document.createElementNS("http://www.w3.org/2000/svg", "path");
          var d = "M " + wire_start[0] + " " + wire_start[1] + " C " + control_point1[0] + " " + control_point1[1] + ", " + control_point2[0] + " " + control_point2[1] + ", " + wire_end[0] + " " + wire_end[1];
          wire.setAttribute("d", d);
          wire.setAttribute("class", "signal-wire");
          svg.appendChild(wire);

          edge["peers"]["end"] = {"strut": connecting_strut.ix, "edge": j};
          connecting_edge["peers"]["start"] = {"strut": strut.ix, "edge": i};
        }
        j++;
      }
    }
    i++;
  } 
}



orderAndNameHubs();
for (hub in hubs) {
  if (hubs[hub].struts.length < 2) {
    continue;
  }
  var circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
  svg.appendChild(circle);
  [x, y] = flatten3dCoordinates(hubs[hub].center);
  circle.setAttribute("cx", x);
  circle.setAttribute("cy", y);
  circle.setAttribute("r", "10");
  circle.setAttribute("class", "hub " + (hubs[hub].powered ? "powered-hub" : "unpowered-hub"));
  circle.setAttribute("data-hub-key", hub);
  // add a label in the center of the circle with the hub.ix
  var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
  text.setAttribute("x", x);
  text.setAttribute("y", y);
  text.setAttribute("font-size", "10");
  text.setAttribute("text-anchor", "middle");
  text.setAttribute("alignment-baseline", "middle");
  text.setAttribute("fill", "white");
  text.textContent = hubs[hub].ix;
  svg.appendChild(text);
  circle.addEventListener("mouseover", function() {
    var key = this.getAttribute("data-hub-key");
    showHubInfo(key);
  });
  if (hubs[hub].powered) {
    wiring_stats.powered_hubs++;
  } else {
    wiring_stats.unpowered_hubs++;
  }
}

// now create a list with all the struts
const strutTable = document.getElementById("strut_table");
for (const strut of struts) {
  const row = document.createElement("tr");

  const checkboxCell = document.createElement("td");
  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = localStorage.getItem(`strut-${strut.ix}-checked`) == "true"; // default to false
  checkbox.addEventListener("change", function() {
    const strutLines = svg.querySelectorAll(`[data-strut-index="${strut.ix}"]`);
    localStorage.setItem(`strut-${strut.ix}-checked`, this.checked);
  });
  checkboxCell.appendChild(checkbox);
  row.appendChild(checkboxCell);

  const indexCell = document.createElement("td");
  indexCell.textContent = strut.ix;
  row.appendChild(indexCell);

  const typeCell = document.createElement("td");
  typeCell.textContent = strut.type;
  row.appendChild(typeCell);

  const lengthCell = document.createElement("td");
  lengthCell.textContent = strut.length.toFixed(2);
  row.appendChild(lengthCell);

  const drawingCell = document.createElement("td");
  const drawing = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  drawing.setAttribute("width", "300");
  drawing.setAttribute("height", "75");
  drawing.setAttribute("viewBox", "0 0 400 100");
  drawStrutSvg(drawing, strut.ix);
  drawingCell.appendChild(drawing);
  row.appendChild(drawingCell);

  strutTable.appendChild(row);
}

function sortStrutTable(colIndex, numeric) {
  const table = document.getElementById("strut_table");
  const rows = Array.from(table.rows).slice(1);
  const headerCell = table.rows[0].cells[colIndex];
  const asc = headerCell.dataset.sortDir !== "asc";
  for (const th of table.rows[0].cells) {
    delete th.dataset.sortDir;
  }
  headerCell.dataset.sortDir = asc ? "asc" : "desc";
  rows.sort((a, b) => {
    const aVal = a.cells[colIndex].textContent;
    const bVal = b.cells[colIndex].textContent;
    const cmp = numeric ? Number(aVal) - Number(bVal) : aVal.localeCompare(bVal);
    return asc ? cmp : -cmp;
  });
  for (const row of rows) {
    table.appendChild(row);
  }
}

// Scale the legend and sidebar proportionally with the SVG (SVG is 1300×1300 logical units)
const svgScale = Math.min(window.innerWidth, window.innerHeight) / 1300;
document.getElementById('legend').style.transform = `scale(${svgScale})`;
// zoom shrinks the sidebar content to match the SVG scale.
// Compensate height and width so the sidebar fills all remaining viewport space after the SVG.
const sidebar = document.getElementById('sidebar');
const svgRenderedSize = svgScale * 1300; // px the SVG actually occupies (square)
sidebar.style.zoom = svgScale;
sidebar.style.height = Math.round(window.innerHeight / svgScale) + 'px';
sidebar.style.width = Math.round((window.innerWidth - svgRenderedSize) / svgScale) + 'px';

stats = document.getElementById("stats");
stats.innerHTML = `<h2>Wiring Stats</h2>
<table>
<tr><th>Strip Starts</th><td>${wiring_stats.strip_starts}</td></tr>
<tr><th>JST Links</th><td>${wiring_stats.jst_links}</td></tr>
<tr><th>Signal Loops</th><td>${wiring_stats.signal_loops}</td></tr>
<tr><th>Powered Hubs</th><td>${wiring_stats.powered_hubs}</td></tr>
<tr><th>Unpowered Hubs</th><td>${wiring_stats.unpowered_hubs}</td></tr>
</table>`;

const TRIANGLE_OPACITY_STORAGE_KEY = "toggle-triangle-opacity-enabled";
const DEBUG_INFO_STORAGE_KEY = "debug-info-enabled";

function setTriangleFillOpacity(enabled) {
  const opacity = enabled ? "1" : "0";
  const polygons = document.querySelectorAll("#svg polygon");
  for (const polygon of polygons) {
    polygon.setAttribute("fill-opacity", opacity);
  }
}

(function initTriangleOpacityToggle() {
  const toggle = document.getElementById("toggle-triangle-opacity");
  if (!toggle) return;

  // default = true (100%) if no saved value exists
  const saved = localStorage.getItem(TRIANGLE_OPACITY_STORAGE_KEY);
  const enabled = saved === null ? true : saved === "true";

  toggle.checked = enabled;
  setTriangleFillOpacity(enabled);

  toggle.addEventListener("change", function () {
    const isEnabled = this.checked;
    setTriangleFillOpacity(isEnabled);
    localStorage.setItem(TRIANGLE_OPACITY_STORAGE_KEY, String(isEnabled));
  });
})();

(function initDebugInfoToggle() {
  const toggle = document.getElementById("toggle-debug-info");
  if (!toggle) return;

  // default = false if no saved value exists
  const saved = localStorage.getItem(DEBUG_INFO_STORAGE_KEY);
  debugInfoEnabled = saved === "true";

  toggle.checked = debugInfoEnabled;

  toggle.addEventListener("change", function () {
    debugInfoEnabled = this.checked;
    localStorage.setItem(DEBUG_INFO_STORAGE_KEY, String(debugInfoEnabled));
  });
})();

</script>
